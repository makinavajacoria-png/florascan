<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FloraScan</title>
<style>
  :root{--verde:#2D6A4F;--verde2:#4A7C59;--salvia:#EDF3EC;--tinta:#1B2420;
        --ambar:#D97706;--rojo:#DC2626;--gris:#6B7280}
  *{box-sizing:border-box;margin:0;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
  body{background:var(--salvia);color:var(--tinta);display:flex;justify-content:center}
  .movil{width:100%;max-width:430px;background:#fff;min-height:100vh;
         box-shadow:0 0 40px rgba(0,0,0,.08);padding:24px 20px 40px}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
  .logo{font-weight:800;font-size:20px;color:var(--verde)}
  .badge{padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;color:#fff;background:var(--verde)}
  h1{font-size:24px;margin-bottom:2px}
  .sub{color:var(--gris);font-size:14px;margin-bottom:20px}
  .acciones{display:flex;gap:10px;margin-bottom:14px}
  button{border:none;border-radius:14px;padding:14px;font-size:15px;font-weight:600;cursor:pointer}
  .primario{background:var(--verde);color:#fff;flex:1}
  .secundario{background:#fff;color:var(--verde);border:1.5px solid var(--verde);flex:1;
              display:flex;align-items:center;justify-content:center}
  video{width:100%;border-radius:16px;background:#000;display:none}
  #capturar{display:none;width:100%;margin-top:10px}
  .preview{width:100%;border-radius:16px;display:none;margin:12px 0}
  #estado{text-align:center;color:var(--gris);font-size:14px;margin:10px 0;min-height:20px}
  .card{border:1px solid #E3EAE2;border-radius:20px;padding:20px;margin-top:14px;display:none;
        box-shadow:0 6px 20px rgba(27,36,32,.06)}
  .nombre{font-size:22px;font-weight:800;margin-top:10px}
  .cientifico{font-style:italic;color:var(--gris);font-size:14px;margin-bottom:10px}
  .ringwrap{display:flex;justify-content:center;margin:4px 0 12px}
  #ring{transition:stroke-dashoffset .9s ease}
  h3{font-size:15px;margin-bottom:6px}
  .lista{padding-left:20px;color:var(--tinta);font-size:14px}
  .lista li{margin-bottom:4px}
  .aviso{margin-top:14px;font-size:12px;color:var(--gris)}
</style>
</head>
<body>
<div class="movil">
  <header>
    <div class="logo">🌿 FloraScan</div>
    <span class="badge">v4.2</span>
  </header>
  <h1>Hola 👋</h1>
  <p class="sub">Escanea una planta para identificarla y conocer su salud.</p>

  <div class="acciones">
    <button id="btnCamara" class="primario" onclick="abrirCamara()">📷 Usar cámara</button>
    <label class="secundario">🖼️ Subir foto
      <input type="file" id="inputFoto" accept="image/*" hidden onchange="subir(event)">
    </label>
  </div>

  <video id="video" playsinline></video>
  <button id="capturar" class="primario" onclick="capturar()">⭕ Capturar y analizar</button>

  <img id="preview" class="preview" alt="">
  <p id="estado"></p>

  <div class="card" id="card">
    <span class="badge" id="fuente"></span>
    <div class="nombre" id="nombre"></div>
    <div class="cientifico" id="cientifico"></div>
    <div class="ringwrap">
      <svg width="150" height="150" viewBox="0 0 150 150">
        <circle cx="75" cy="75" r="62" stroke="#E5EAE4" stroke-width="12" fill="none"/>
        <circle id="ring" cx="75" cy="75" r="62" stroke="#2D6A4F" stroke-width="12" fill="none"
                stroke-linecap="round" stroke-dasharray="389.6" stroke-dashoffset="389.6"
                transform="rotate(-90 75 75)"/>
        <text id="score" x="75" y="72" text-anchor="middle" font-size="30" font-weight="800" fill="#1B2420"></text>
        <text id="estadoSalud" x="75" y="96" text-anchor="middle" font-size="13" fill="#6B7280"></text>
      </svg>
    </div>
    <h3>🍃 Síntomas detectados</h3>
    <ul id="sintomas" class="lista"></ul>
    <h3 style="margin-top:12px">💡 Tratamiento / Recomendaciones</h3>
    <ul id="recomendaciones" class="lista"></ul>
    <h3 style="margin-top:12px">💧 Cuidados de esta planta</h3>
    <ul id="cuidados" class="lista"></ul>
    <p class="aviso">⚠️ Análisis orientativo asistido por IA. No sustituye la evaluación de un experto.</p>
  </div>
</div>

<script>
let stream = null;
const video = document.getElementById('video');

// Oculta "Usar cámara" SOLO si el navegador no soporta cámara
// (sin HTTPS o navegador antiguo). En Render (HTTPS) el móvil SÍ la verá.
if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
  document.getElementById('btnCamara').style.display = 'none';
}

async function abrirCamara(){
  try{
    stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    video.srcObject = stream; video.style.display = 'block';
    document.getElementById('capturar').style.display = 'block';
    await video.play();
  }catch(e){ alert('No se pudo abrir la cámara: ' + e); }
}

function capturar(){
  const c = document.createElement('canvas');
  c.width = video.videoWidth; c.height = video.videoHeight;
  c.getContext('2d').drawImage(video, 0, 0);
  stream.getTracks().forEach(t => t.stop());
  video.style.display = 'none';
  document.getElementById('capturar').style.display = 'none';
  c.toBlob(analizar, 'image/jpeg', 0.9);
}

async function subir(ev){
  const f = ev.target.files[0];
  if (f) await analizar(f);
}

// Comprime/redimensiona la foto antes de enviarla (máx. 1280 px)
async function prepararBlob(blob){
  try{
    const bmp = await createImageBitmap(blob);
    const max = 1280;
    const esc = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas');
    c.width = Math.round(bmp.width * esc);
    c.height = Math.round(bmp.height * esc);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    return await new Promise(res => c.toBlob(res, 'image/jpeg', 0.9));
  }catch(e){
    return blob;
  }
}

async function analizar(blobOriginal){
  const blob = await prepararBlob(blobOriginal);
  document.getElementById('preview').src = URL.createObjectURL(blob);
  document.getElementById('preview').style.display = 'block';
  document.getElementById('estado').textContent = '🔬 Analizando con IA...';
  const fd = new FormData(); fd.append('imagen', blob, 'foto.jpg');
  try{
    const r = await fetch('/analizar', {method:'POST', body:fd});
    if (!r.ok){
      document.getElementById('estado').textContent = '❌ Error del servidor: ' + r.status;
      return;
    }
    pintar(await r.json());
  }catch(e){
    document.getElementById('estado').textContent = '❌ Error: ' + e;
  }
}

function limpiar(s){ return (s || '').split(' (')[0]; }

function pintar(d){
  document.getElementById('estado').textContent = '';
  document.getElementById('card').style.display = 'block';

  // Especie
  const pn = d.especie.plantnet ? d.especie.plantnet[0] : null;
  const lo = d.especie.local ? d.especie.local[0] : null;
  let titulo = 'Desconocida', sub = '', fuente = '';

  if ((d.especie.fuente === 'gemini' || d.especie.fuente === 'qwen') && d.especie.nombre_comun){
    titulo = d.especie.nombre_comun;
    sub = 'Diagnóstico por IA';
    fuente = d.especie.fuente === 'qwen' ? '🤖 Qwen AI' : '🤖 Gemini AI';
  } else if (d.especie.fuente === 'plantnet' && pn){
    titulo = pn.nombre_comun || limpiar(pn.nombre_cientifico);
    sub = pn.nombre_cientifico;
    fuente = 'Pl@ntNet · ' + Math.round(pn.confianza * 100) + '%';
  } else if (lo){
    titulo = lo.clase.charAt(0).toUpperCase() + lo.clase.slice(1);
    sub = 'Modelo local FloraScan';
    fuente = 'Local · ' + Math.round(lo.confianza * 100) + '%';
  }
  document.getElementById('fuente').textContent = fuente;
  document.getElementById('nombre').textContent = titulo;
  document.getElementById('cientifico').textContent = sub;

  // Salud
  const s = d.salud, C = 389.6;
  const color = s.estado === 'saludable' ? '#2D6A4F' : (s.estado === 'atencion' ? '#D97706' : '#DC2626');
  const ring = document.getElementById('ring');
  ring.style.stroke = color;
  ring.style.strokeDashoffset = C * (1 - s.puntuacion / 100);
  document.getElementById('score').textContent = s.puntuacion + '%';
  document.getElementById('estadoSalud').textContent =
    s.estado === 'saludable' ? 'Saludable' : (s.estado === 'atencion' ? 'Atención necesaria' : 'Crítico');

  // Síntomas
  const sintomas = (s.sintomas && s.sintomas.length > 0) ? s.sintomas : ['Sin síntomas visibles'];
  document.getElementById('sintomas').innerHTML = sintomas.map(x => '<li>' + x + '</li>').join('');

  // Diagnóstico en lenguaje natural (si viene de la IA)
  if (s.diagnostico){
    document.getElementById('sintomas').innerHTML +=
      '<li style="margin-top:8px;color:#2D6A4F"><b>🩺 ' + s.diagnostico + '</b></li>';
  }

  // Tratamiento / recomendaciones
  const recs = (s.recomendaciones && s.recomendaciones.length > 0)
    ? s.recomendaciones : ['Mantén los cuidados habituales'];
  document.getElementById('recomendaciones').innerHTML = recs.map(x => '<li>' + x + '</li>').join('');

  // Cuidados por grupo botánico
  const c = d.cuidados;
  const elC = document.getElementById('cuidados');
  if (c){
    elC.innerHTML = '<li><b>' + c.grupo + '</b></li>' +
      '<li>💧 Riego: ' + c.riego + '</li>' +
      '<li>☀️ Luz: ' + c.luz + '</li>' +
      '<li>⚠️ Su punto débil: ' + c.tipico + '</li>';
  } else {
    elC.innerHTML = '<li>💧 Riego moderado, buena luz y observa su respuesta.</li>';
  }
}
</script>
</body>
</html>
